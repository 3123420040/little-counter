server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /customer/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /customer/index.html {
        try_files /customer/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location /customer/ {
        try_files $uri $uri/ /customer/index.html;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /s/ {
        try_files /customer/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location /api/admin/ {
        rewrite ^/api/admin/(.*)$ /platform/admin/$1 break;
        proxy_pass http://medusa:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://medusa:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ai {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location = /ai/ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location = /ai/health {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location = /ai/reply-draft {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location = /ai/order-draft {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location /ai/vision/ {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location /ai/product-research {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location = /ai/review-queue {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location /ai/actions/ {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location /ai/alerts {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }

    location /ai/recommendations/ {
        proxy_pass http://ai:3002;
        proxy_set_header Host $host;
    }
}
